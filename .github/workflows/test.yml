name: Backend Tests

# This section tells GitHub WHEN to run the pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# This section tells GitHub WHAT to do when the pipeline runs
jobs:
  test:
    # We are asking GitHub to rent us a temporary Ubuntu Linux computer to run our tests
    runs-on: ubuntu-latest

    # We need a PostgreSQL database for our tests, just like the one on your laptop
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: bizit_test_db
        ports:
          - 5432:5432
        # This tells the server to wait until the database is fully booted up before continuing
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # These are the step-by-step instructions the computer will follow
    steps:
      # Step 1: Download your code from the GitHub repository onto the temporary computer
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # This caches the dependencies so future tests run much faster
          cache: "pip"

      # Step 3: Install the requirements (FastAPI, Pytest, psycopg2, etc.)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Step 4: Run the actual tests!
      - name: Run tests with Pytest
        env:
          # We tell Pytest to connect to the temporary database we created above
          TEST_DATABASE_URL: postgresql://postgres:1234@localhost:5432/bizit_test_db
        run: |
          cd backend
          pytest tests/ -v
